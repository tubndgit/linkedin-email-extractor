# Prefer environment variables; never commit real API keys.
# AnyMailFinder signup (affiliate): https://anymailfinder.com?via=henry-b
api_keys:
  hunter_io: ""       # HUNTER_API_KEY
  neverbounce: ""     # NEVERBOUNCE_API_KEY
  anymailfinder: ""   # ANYMAILFINDER_API_KEY

# Read timeout in seconds (connection timeout is 5 seconds).
# Anymail Finder recommends allowing 180 seconds for person searches.
request_timeout: 180
